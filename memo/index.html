<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>受信簿ポスト</title>
<link rel="icon" href="/memo/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/memo/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/memo/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="受信簿">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#b2362a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: light;
    /* 首里城：朱塗り・金の装飾・黒漆・胡粉の白 */
    --paper:      #f7f3ec;
    --surface:    #fffdf9;
    --surface-2:  #f0e8dc;
    --line:       #ddd2c2;
    --line-soft:  #ebe3d6;
    --ink:        #241b17;
    --ink-2:      #574a43;
    --ink-3:      #8a796e;
    --ai:         #b2362a;
    --ai-soft:    #f7e4df;
    --ai-ink:     #8a2820;
    --gold:       #a8842c;
    --ok:         #3f7a52;
    --danger:     #6f2a1b;
    --shadow:     0 1px 2px rgba(36,27,23,.07), 0 8px 24px rgba(36,27,23,.06);
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic Medium", system-ui, sans-serif;
    --serif: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #16110f; --surface: #1e1815; --surface-2: #29211d;
      --line: #3b302a; --line-soft: #2f2621;
      --ink: #f0e7de; --ink-2: #c0b0a4; --ink-3: #8d7d72;
      --ai: #e0715f; --ai-soft: #3a221d; --ai-ink: #f3b8ab;
      --gold: #d9b45f;
      --ok: #7fb894; --danger: #d98a80;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #16110f; --surface: #1e1815; --surface-2: #29211d;
    --line: #3b302a; --line-soft: #2f2621;
    --ink: #f0e7de; --ink-2: #c0b0a4; --ink-3: #8d7d72;
    --ai: #e0715f; --ai-soft: #3a221d; --ai-ink: #f3b8ab;
    --gold: #d9b45f;
    --ok: #7fb894; --danger: #d98a80;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.75;
    -webkit-text-size-adjust: 100%;
  }
  img { max-width: 100%; }
  .wrap {
    max-width: 460px;
    margin: 0 auto;
    padding: 14px 16px 48px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  header {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    border-bottom: 1px solid var(--gold);
    padding-bottom: 6px;
  }
  h1 {
    color: var(--ai);
    font-family: var(--serif);
    font-size: 18px; font-weight: 600;
    letter-spacing: .06em; margin: 0;
    text-wrap: balance;
  }
  .sub { color: var(--ink-3); font-size: 13px; line-height: 1.6; }
  .sub a { color: var(--ai); }

  .composer {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .eyebrow {
    font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--gold);
  }
  input[type="date"], input[type="url"], input[type="password"] {
    font: 500 15px/1.4 var(--mono);
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 7px 10px;
    accent-color: var(--ai);
  }
  input[type="url"], input[type="password"] { width: 100%; font-size: 13px; }
  input[type="date"] { min-height: 36px; font-size: 13.5px; padding: 5px 8px; }


  textarea {
    font-family: var(--sans); font-size: 16px; line-height: 1.8;
    color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 11px 12px;
    min-height: 52vh; max-height: 74vh;
    resize: vertical; width: 100%;
  }
  textarea::placeholder { color: var(--ink-3); }
  textarea:focus-visible, input:focus-visible, button:focus-visible {
    outline: 2px solid var(--ai); outline-offset: 2px;
  }


  .send-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin: -4px -12px 0;
    padding: 8px 12px 9px;
    background: var(--surface);
    border-bottom: 1px solid var(--line-soft);
    border-radius: 10px 10px 0 0;
  }
  .save-state {
    font-family: var(--mono); font-size: 11.5px; letter-spacing: .03em;
    color: var(--ink-3); display: flex; align-items: center; gap: 6px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .save-state[data-state="sent"] { color: var(--ok); }
  .save-state[data-state="sent"] .dot { background: var(--ok); }
  .save-state[data-state="sending"] .dot,
  .save-state[data-state="count"] .dot { background: var(--ai); }
  .save-state[data-state="count"] { color: var(--ai); }
  .save-state[data-state="error"] { color: var(--danger); }
  .save-state[data-state="error"] .dot { background: var(--danger); }

  .sendnow {
    font-family: var(--sans); font-size: 14px; font-weight: 600;
    color: #fff; background: var(--ai);
    border: none; border-radius: 8px;
    padding: 12px 20px; min-height: 44px; cursor: pointer;
  }
  :root[data-theme="dark"] .sendnow { color: #1a100d; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sendnow { color: #1a100d; } }
  .sendnow:disabled { opacity: .4; cursor: default; }

  .notice {
    font-size: 13.5px; line-height: 1.7; color: var(--ink-2);
    background: var(--surface-2);
    border-left: 3px solid var(--ai);
    border-radius: 0 6px 6px 0; padding: 10px 13px;
  }
  .notice.bad { border-left-color: var(--danger); }

  .unsent {
    font-size: 13.5px; line-height: 1.6; font-weight: 600;
    color: #fff; background: var(--ai);
    border-radius: 8px; padding: 9px 12px;
  }
  :root[data-theme="dark"] .unsent { color: #1a100d; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .unsent { color: #1a100d; } }

  .sendnow.urgent {
    box-shadow: 0 0 0 3px var(--ai-soft);
  }

  details.settings {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 0 14px;
  }
  details.settings > summary {
    cursor: pointer; padding: 11px 0;
    font-family: var(--mono); font-size: 11.5px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--gold);
  }
  .settings-body { display: flex; flex-direction: column; gap: 10px; padding: 4px 0 16px; }
  .settings-body label { font-size: 12.5px; color: var(--ink-2); display: flex; flex-direction: column; gap: 5px; }
  .settings-note { font-size: 12px; color: var(--ink-3); line-height: 1.65; }
  .saved-mark {
    font: 600 12px/1 var(--sans); color: var(--ok);
    background: var(--surface-2); border: 1px solid var(--ok);
    border-radius: 999px; padding: 7px 12px; align-self: flex-start;
  }
  .diag-btn {
    font: 600 13px/1 var(--sans);
    color: var(--ai); background: var(--surface-2);
    border: 1px solid var(--ai); border-radius: 8px;
    padding: 0 14px; min-height: 42px; cursor: pointer;
  }
  .diag-out {
    font-family: var(--mono); font-size: 11.5px; line-height: 1.7;
    white-space: pre-wrap; overflow-wrap: anywhere;
    background: var(--surface-2); color: var(--ink-2);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; margin: 0;
  }

  .readback {
    margin: 0; font-size: 13px; line-height: 1.8; color: var(--ink-3);
    text-align: center;
  }
  .readback a { color: var(--ai); font-weight: 600; }

  .toast {
    position: fixed; left: 50%; bottom: 22px;
    transform: translateX(-50%) translateY(8px);
    background: var(--ink); color: var(--paper);
    font-size: 13.5px; padding: 9px 18px; border-radius: 999px;
    box-shadow: var(--shadow); opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (prefers-reduced-motion: reduce) { .toast, .tag { transition: none; } }

  @media (max-width: 540px) {
    .wrap { padding: 12px 12px 36px; gap: 12px; }
    .send-row { margin: -4px -12px -12px; padding: 9px 12px calc(9px + env(safe-area-inset-bottom)); }
    textarea { min-height: 30vh; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>受信簿ポスト</h1>
    <input type="date" id="date" aria-label="日付">
  </header>

  <div id="status" class="notice" hidden></div>
  <div id="unsent" class="unsent" hidden>未送信の下書きがあるよ。「いま送る」で受信簿へ入る。</div>

  <section class="composer">
    <div class="send-row">
      <span class="save-state" id="saveState" data-state="idle" role="status" aria-live="polite">
        <span class="dot"></span><span id="saveLabel">まだ何も書いてない</span>
      </span>
      <button class="sendnow" id="sendNow" type="button" disabled>いま送る</button>
    </div>

    <textarea id="text" autocapitalize="sentences" autocorrect="on" spellcheck="false" placeholder="ここに書く。書けたら「いま送る」を押してね。勝手には送らないよ。"></textarea>
  </section>


  <p class="readback">
    読み返しは
    <a href="https://docs.google.com/document/d/1SWEqKdvrh5--hmeMtyF7kY-w3QPqMGICxNh4JJgCNBQ/edit" target="_blank" rel="noopener">受信簿を開く</a>
    から。
  </p>

  <details class="settings" id="settings">
    <summary>送り先の設定</summary>
    <div class="settings-body">
      <label>受け皿のURL（…/exec）
        <input type="url" id="endpoint" placeholder="https://script.google.com/macros/s/……/exec" autocomplete="off">
      </label>
      <div class="settings-note">
        このブラウザの中だけに保存される。ほかの人にも、AIにも渡らない。
        スマホでも使うときは、スマホ側で同じものを1回入れてね。
      </div>
      <div class="saved-mark" id="savedMark" hidden>✓ 保存した</div>
      <button class="diag-btn" id="diag" type="button">つながりを確認する</button>
      <pre class="diag-out" id="diagOut" hidden></pre>
    </div>
  </details>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
window.addEventListener("error", function (ev) {
  var el = document.getElementById("status");
  if (!el) return;
  el.className = "notice bad";
  el.hidden = false;
  el.textContent = "ページの中で問題が起きた：" + (ev.message || "原因不明") +
    "（" + String(ev.filename || "").split("/").pop() + " " + (ev.lineno || "?") + "行目）";
});
window.addEventListener("unhandledrejection", function (ev) {
  var el = document.getElementById("status");
  if (!el) return;
  el.className = "notice bad";
  el.hidden = false;
  el.textContent = "通信で問題が起きた：" + ((ev.reason && ev.reason.message) || String(ev.reason || "原因不明"));
});
(function () {
  var DOW = ["日","月","火","水","木","金","土"];
  var K = { ep: "jushinbo.endpoint", sec: "jushinbo.secret", draft: "jushinbo.draft", log: "jushinbo.log" };

  var $ = function (id) { return document.getElementById(id); };
  var $date = $("date"), $text = $("text");
  var $status = $("status"), $toast = $("toast"), $saveState = $("saveState");
  var $saveLabel = $("saveLabel"), $sendNow = $("sendNow");
  var $endpoint = $("endpoint"), $settings = $("settings");
  var $unsent = $("unsent");

  var sending = false;
  var composing = false;   // 日本語入力の変換中
  var lastSig = "", lastSentAt = 0;

  function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function todayStr() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function nowTime() { var d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function dowOf(s) { var p = String(s).split("-"); var d = new Date(+p[0], +p[1]-1, +p[2]); return isNaN(d.getTime()) ? "" : DOW[d.getDay()]; }
  function newId() { return (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2); }

  function toast(m) {
    $toast.textContent = m; $toast.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(function(){ $toast.classList.remove("show"); }, 2400);
  }
  function say(m, bad) {
    if (!m) { $status.hidden = true; return; }
    $status.textContent = m; $status.className = "notice" + (bad ? " bad" : ""); $status.hidden = false;
  }
  function mark(state, label) { $saveState.setAttribute("data-state", state); $saveLabel.textContent = label; }


  // ---- 設定 ----
  $endpoint.value = load(K.ep) || "";
  var $savedMark = $("savedMark");
  function flashSaved() {
    $savedMark.hidden = false;
    clearTimeout(flashSaved._t);
    flashSaved._t = setTimeout(function () { $savedMark.hidden = true; }, 2500);
  }
  function saveSettings() {
    store(K.ep, $endpoint.value.trim());
    checkReady();
    flashSaved();
  }
  ["input", "change", "blur", "paste"].forEach(function (ev) {
    $endpoint.addEventListener(ev, function () { setTimeout(saveSettings, 0); });
  });

  function configured() { return !!(($endpoint.value||"").trim()); }
  function checkReady() {
    if (!configured()) {
      $settings.open = true;
      say("送り先がまだ設定されてないよ。「送り先の設定」に、受け皿のURLを入れてね。入れるまで、書いたものはこのブラウザに預かっておく。");
    } else { say(""); }
  }


  // ---- 下書きの復元 ----
  $date.value = todayStr();
  (function restore() {
    var raw = load(K.draft);
    if (!raw) return;
    try {
      var d = JSON.parse(raw);
      if (d.text) $text.value = d.text;
    } catch (e) {}
  })();

  try { localStorage.removeItem(K.log); localStorage.removeItem(K.sec); } catch (e) {}

  function saveDraft() {
    store(K.draft, JSON.stringify({ text: $text.value, date: $date.value }));
  }


  // ---- 送信 ----
  function stopTimers() {}

  function updateButton() {
    $sendNow.disabled = sending || !$text.value.trim();
  }

  function armIdle() {
    stopTimers();
    updateButton();
    var has = !!$text.value.trim();
    $unsent.hidden = !has;
    $sendNow.classList.toggle("urgent", has);
    document.title = (has ? "● " : "") + "受信簿ポスト";
    if (!has) { composing = false; mark("idle", "まだ何も書いてない"); return; }
    if (composing) { mark("draft", "入力中"); return; }
    mark("draft", "未送信（押すと送る）");
  }


  function send(auto) {
    composing = false;
    var text = $text.value.replace(/\s+$/, "");
    if (!text.trim() || sending) return;
    stopTimers();

    // 同じ文を続けて送らない（二重送信よけ）
    var sig = ($date.value || todayStr()) + "\n" + text;
    if (auto && sig === lastSig && Date.now() - lastSentAt < 120000) {
      mark("sent", "さっきと同じ文なので自動では送らなかった");
      toast("さっきと同じ文だよ。送るなら「いま送る」を押して");
      updateButton();
      return;
    }

    var payload = {
      id: newId(),
      date: $date.value || todayStr(),
      time: nowTime(),
      tag: "",
      text: text
    };

    if (!configured()) { mark("error", "送り先が未設定"); checkReady(); return; }

    sending = true; updateButton();
    mark("sending", "受信簿へ送ってる…");
    say("");

    postIt(payload).then(function (res) {
      sending = false; updateButton();
      if (res.ok) {
        lastSig = payload.date + "\n" + payload.text;
        lastSentAt = Date.now();
        $text.value = ""; composing = false;
              saveDraft();
        $unsent.hidden = true;
        $sendNow.classList.remove("urgent");
        document.title = "受信簿ポスト";
        mark("sent", res.confirmed ? ("受信簿に入れたよ " + payload.time) : ("送ったよ " + payload.time + "（要確認）"));
        toast(res.confirmed ? "受信簿に追記したよ" : "送ったよ。念のため受信簿を見てね");
        say("");
        updateButton();
        $text.focus();
      } else {
        mark("error", "送れなかった");
        say("受信簿へ送れなかった：" + (res && res.error || "理由不明") + "。文章はこのまま残してあるから、通信を確かめて「いま送る」を押してみて。", true);
        updateButton();
      }
    });
  }

  // Apps Script は text/plain で送ると事前確認（プリフライト）が起きない
  function postIt(payload) {
    var url = $endpoint.value.trim();
    var body = JSON.stringify({
      date: payload.date, time: payload.time,
      tag: payload.tag, text: payload.text
    });
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: body,
      redirect: "follow"
    }).then(function (r) { return r.text(); })
      .then(function (t) {
        var j = null;
        try { j = JSON.parse(t); } catch (e) {}
        if (j && j.ok) return { ok: true, confirmed: true };
        if (j && !j.ok) return { ok: false, error: j.error || "受け皿が断った" };
        return { ok: false, error: "受け皿の返事が読めなかった" };
      })
      .catch(function () {
        // 返事が読めない場合でも、届いてはいる可能性がある（no-cors で投げ直す）
        return fetch(url, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: body })
          .then(function () { return { ok: true, confirmed: false }; })
          .catch(function (e) { return { ok: false, error: String(e && e.message || "通信できなかった") }; });
      });
  }


  function grow() {
    $text.style.height = "auto";
    var max = Math.round(window.innerHeight * 0.6);
    $text.style.height = Math.min($text.scrollHeight + 2, max) + "px";
  }
  var imeGuard = null;
  function markComposing() {
    composing = true;
    clearTimeout(imeGuard);
    // 変換終了の合図が来ないことがあるので、5秒で自動的に解除する
    imeGuard = setTimeout(function () { composing = false; armIdle(); }, 5000);
  }
  $text.addEventListener("compositionstart", function () { markComposing(); stopTimers(); updateButton(); mark("draft", "入力中"); });
  $text.addEventListener("compositionend", function () {
    clearTimeout(imeGuard); composing = false; grow(); saveDraft(); armIdle();
  });
  $text.addEventListener("input", function (e) {
    grow(); saveDraft(); updateButton();
    if (e && e.isComposing) { markComposing(); stopTimers(); return; }
    clearTimeout(imeGuard); composing = false;
    armIdle();
  });
  window.addEventListener("resize", grow);
  $date.addEventListener("change", saveDraft);
  $sendNow.addEventListener("click", function () { send(false); });
  $text.addEventListener("keydown", function (e) {
    if (e.isComposing || e.keyCode === 229) return;
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); send(false); }
  });
  $text.addEventListener("blur", function () { saveDraft(); armIdle(); });

  var $diag = $("diag"), $diagOut = $("diagOut");
  $diag.addEventListener("click", function () {
    var out = [];
    var url = ($endpoint.value || "").trim();
    $diagOut.hidden = false;
    $diagOut.textContent = "確認中…";

    function show() { $diagOut.textContent = out.join("\n"); }

    out.push("1. URL: " + (url ? (/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url) ? "形は正しい" : "★形がおかしい（…/exec で終わってる？）") : "★空っぽ"));
    show();
    if (!url) return;

    fetch(url, { method: "GET" })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        out.push("2. 受け皿を開く: 返事あり" + (t.indexOf("動いています") >= 0 ? "（正常）" : "（内容が想定外: " + t.slice(0, 60) + "）"));
      })
      .catch(function (e) { out.push("2. 受け皿を開く: ★失敗 " + (e && e.message || "")); })
      .then(function () {
        show();
        var d = new Date();
        var body = JSON.stringify({
          date: $date.value || todayStr(),
          time: nowTime(),
          tag: "",
          text: "つながり確認テスト " + d.toLocaleTimeString("ja-JP")
        });
        return fetch(url, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: body,
          redirect: "follow"
        }).then(function (r) { return r.text(); })
          .then(function (t) {
            out.push("3. 送信テスト: 返事 → " + t.slice(0, 160));
          })
          .catch(function (e) {
            out.push("3. 送信テスト: ★返事を読めなかった " + (e && e.message || ""));
          });
      })
      .then(show);
  });


  checkReady();
  armIdle();
  grow();
  try { $text.focus(); } catch (e) {}
})();
</script>
</body>
</html>
